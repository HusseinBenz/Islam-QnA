  <script>
    (function () {
      var esc = Site.escapeHtml;
      var ICONS = {
        up: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg>',
        down: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/></svg>',
        x: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>',
        wa: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>',
        link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>'
      };

      function isSafeUrl(url) {
        if (!url) return true;
        var t = String(url).trim().toLowerCase();
        if (t.startsWith('javascript:') || t.startsWith('data:') || t.startsWith('vbscript:')) return false;
        if (t.startsWith('#') || t.startsWith('/') || t.startsWith('./') || t.startsWith('../')) return true;
        try { var p = new URL(url, window.location.origin); return ['http:', 'https:', 'mailto:', 'tel:'].indexOf(p.protocol) !== -1; } catch (e) { return false; }
      }

      function setupMarked() {
        if (typeof marked === 'undefined') return;
        var r = new marked.Renderer();
        r.link = function (href, title, text) { if (!isSafeUrl(href)) return esc(text); return '<a href="' + esc(href) + '"' + (title ? ' title="' + esc(title) + '"' : '') + ' target="_blank" rel="noopener">' + text + '</a>'; };
        r.image = function (h, t, text) { return esc(text || ''); };
        r.html = function () { return ''; };
        marked.setOptions({ renderer: r, gfm: true, breaks: true, mangle: false, headerIds: false });
      }

      function formatDate(ds) { if (!ds) return ''; try { return new Date(ds).toLocaleDateString(I18n.getLang(), { year: 'numeric', month: 'long', day: 'numeric' }); } catch (e) { return ds; } }

      function renderArticle(entry, data, entries) {
        var lang = I18n.getLang();
        var c = document.getElementById('article-container');
        var raw = data.entries.filter(function (x) { return x.id === entry.id; })[0] || {};
        var available = [data.config.defaultLang].concat(Object.keys(raw.translations || {}));
        var langs = I18n.getLanguages();
        var ar = lang === 'ar';

        var html = '<div class="article__top"><div class="article__tags">' + Site.tagsHtml(entry.tags).replace(/sk-tag"/, 'sk-tag sk-tag--accent"') + '</div>';
        if (available.length > 1) {
          html += '<div class="lang-seg" role="group" aria-label="' + esc(I18n.t('language')) + '">';
          available.forEach(function (code) {
            if (!langs[code]) return;
            html += '<a href="article.html?id=' + entry.id + '&lang=' + code + '" lang="' + code + '"' + (code === lang ? ' aria-current="true"' : '') + '>' + esc(langs[code].label) + '</a>';
          });
          html += '</div>';
        }
        html += '</div>';
        html += '<h1 class="sk-display article__question">' + esc(entry.question) + '</h1>';
        var meta = [];
        if (entry.created_at) meta.push(esc(I18n.t('posted_on')) + ' ' + formatDate(entry.created_at));
        meta.push(Site.minutes(entry.answer) + ' ' + (ar ? 'دقيقة قراءة' : 'min read'));
        html += '<p class="article__meta">' + meta.join(' · ') + '</p>';

        var answerHtml = typeof marked !== 'undefined' ? marked.parse(entry.answer || '') : '<p>' + esc(entry.answer || '').replace(/\n/g, '<br>') + '</p>';
        html += '<div class="prose">' + answerHtml + '</div>';

        var pageUrl = window.location.href;
        var cv = Votes.getVote(entry.id);
        html += '<div class="article__end">';
        html += '<div class="feedback"><span class="feedback__label">' + (ar ? 'هل كان هذا مفيدًا؟' : 'Was this helpful?') + '</span><div class="feedback__buttons">' +
          '<button type="button" class="sk-chip" data-vote="1" aria-pressed="' + (cv === 1) + '">' + ICONS.up + (ar ? 'نعم' : 'Yes') + '</button>' +
          '<button type="button" class="sk-chip" data-vote="-1" aria-pressed="' + (cv === -1) + '">' + ICONS.down + (ar ? 'ليس تمامًا' : 'Not quite') + '</button>' +
          '</div><div class="feedback__msg" id="vote-message" role="status"></div></div>';
        html += '<div class="share"><span class="share__label">' + esc(I18n.t('share')) + '</span><div class="share__buttons">' +
          '<a class="sk-icon-btn" href="https://x.com/intent/tweet?text=' + encodeURIComponent(entry.question) + '&url=' + encodeURIComponent(pageUrl) + '" target="_blank" rel="noopener" aria-label="' + esc(I18n.t('share_twitter')) + '" title="' + esc(I18n.t('share_twitter')) + '">' + ICONS.x + '</a>' +
          '<a class="sk-icon-btn" href="https://wa.me/?text=' + encodeURIComponent(entry.question + ' ' + pageUrl) + '" target="_blank" rel="noopener" aria-label="' + esc(I18n.t('share_whatsapp')) + '" title="' + esc(I18n.t('share_whatsapp')) + '">' + ICONS.wa + '</a>' +
          '<button type="button" class="sk-icon-btn" id="copy-link-btn" aria-label="' + esc(I18n.t('share_copy')) + '" title="' + esc(I18n.t('share_copy')) + '">' + ICONS.link + '</button>' +
          '</div></div>';

        // Previous / next question in the same language
        var idx = -1;
        entries.forEach(function (e, i) { if (e.id === entry.id) idx = i; });
        var prev = idx > 0 ? entries[idx - 1] : null;
        var next = idx >= 0 && idx < entries.length - 1 ? entries[idx + 1] : null;
        if (prev || next) {
          html += '<nav class="article-nav" aria-label="' + (ar ? 'أسئلة أخرى' : 'More questions') + '">';
          html += prev ? '<a class="sk-card sk-lift" href="article.html?id=' + prev.id + '&lang=' + lang + '"><small>' + esc(I18n.t('previous')) + '</small><span>' + esc(prev.question) + '</span></a>' : '<span></span>';
          html += next ? '<a class="sk-card sk-lift" href="article.html?id=' + next.id + '&lang=' + lang + '"><small>' + esc(I18n.t('next')) + '</small><span>' + esc(next.question) + '</span></a>' : '';
          html += '</nav>';
        }
        html += '</div>';
        c.innerHTML = html;

        document.getElementById('copy-link-btn').addEventListener('click', function () {
          var btn = this;
          Sakina.copy(window.location.href).then(function () {
            btn.classList.add('is-copied');
            Sakina.toast(I18n.t('share_copied'));
            setTimeout(function () { btn.classList.remove('is-copied'); }, 2000);
          });
        });

        c.querySelectorAll('[data-vote]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var nv = Votes.castVote(entry.id, parseInt(this.getAttribute('data-vote'), 10));
            c.querySelectorAll('[data-vote]').forEach(function (b) { b.setAttribute('aria-pressed', String(parseInt(b.getAttribute('data-vote'), 10) === nv)); });
            var msg = document.getElementById('vote-message');
            msg.textContent = nv ? I18n.t('vote_thank') : '';
            setTimeout(function () { msg.textContent = ''; }, 2500);
          });
        });
      }

      function renderMissing() {
        document.getElementById('article-container').innerHTML =
          '<div class="empty-state"><svg width="34" height="34" viewBox="-12 -12 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" d="M11 0L7.78 3.22L7.78 7.78L3.22 7.78L0 11L-3.22 7.78L-7.78 7.78L-7.78 3.22L-11 0L-7.78 -3.22L-7.78 -7.78L-3.22 -7.78L0 -11L3.22 -7.78L7.78 -7.78L7.78 -3.22Z"/></svg><div>' +
          esc(I18n.t('entry_missing')) + '</div><a class="sk-btn sk-btn--line sk-btn--sm" href="browse.html?browse=1&lang=' + I18n.getLang() + '">' + esc(I18n.t('browse')) + '</a></div>';
      }

      setupMarked();

      DataStore.loadAll().then(function (data) {
        var lang = I18n.init(data.uiStrings, data.languages, data.config.defaultLang);
        Site.initChrome(lang);
        var back = document.getElementById('back-link');
        back.href = 'browse.html?lang=' + lang + '&browse=1';
        document.getElementById('back-label').textContent = I18n.t('browse');

        var params = new URLSearchParams(window.location.search);
        var entryId = parseInt(params.get('id'), 10);
        var entries = DataStore.getEntries(data.entries, lang, data.config.defaultLang);
        var entry = entryId ? DataStore.getEntry(data.entries, entryId, lang, data.config.defaultLang) : null;
        if (entry) {
          document.title = entry.question + ' — ' + I18n.t('title');
          renderArticle(entry, data, entries);
        } else {
          renderMissing();
        }
      });
    })();
  </script>
