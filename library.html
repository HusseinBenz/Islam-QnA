  <script>
    (function () {
      var esc = Site.escapeHtml;
      function set(id, text) { document.getElementById(id).textContent = text; }

      DataStore.loadAll().then(function (data) {
        var lang = I18n.init(data.uiStrings, data.languages, data.config.defaultLang);
        Site.initChrome(lang);
        document.title = I18n.t('library_title') + ' — ' + I18n.t('title');
        set('lib-eyebrow', I18n.t('title'));
        set('lib-title', I18n.t('library_title'));
        set('lib-lede', I18n.t('library_lede'));
        set('lib-scripture-title', I18n.t('library_scripture_title'));
        set('lib-scripture-text', I18n.t('library_scripture_text'));
        set('lib-note', I18n.t('library_disclaimer'));

        var entries = DataStore.getEntries(data.entries, lang, data.config.defaultLang);
        var sources = data.sources || {};

        // Which questions cite each book
        var citedIn = {};
        entries.forEach(function (e) {
          (e.sources || []).forEach(function (key) { (citedIn[key] = citedIn[key] || []).push(e); });
        });

        document.getElementById('lib-spines').innerHTML = (data.config.shelf || []).map(function (key) {
          var src = sources[key];
          if (!src) return '';
          var label = Site.spineLabel(src, lang);
          return '<span class="spine">' + esc(label) + '</span>';
        }).join('');

        var html = '';
        ['classical', 'modern', 'outside'].forEach(function (kind) {
          var keys = Object.keys(sources).filter(function (k) { return sources[k].kind === kind; });
          if (!keys.length) return;
          html += '<section class="lib-group lib-group--' + kind + '"><div class="lib-group__head"><h2>' + esc(I18n.t('kind_' + kind)) + '</h2><span>' + keys.length + '</span></div><div class="books">';
          keys.forEach(function (key) {
            var s = Site.sourceText(sources[key], lang);
            var cited = (citedIn[key] || []).map(function (e) {
              return '<a href="' + Site.articleUrl(e.id, lang) + '">' + esc(e.question) + '</a>';
            }).join('');
            html += '<article class="book sk-card" id="' + esc(key) + '">' +
              '<h3 class="book__title">' + esc(s.title) + '</h3>' +
              '<div class="book__by">' + esc(s.author) + (s.year ? ' · ' + esc(s.year) : '') + '</div>' +
              (s.note ? '<p class="book__note">' + esc(s.note) + '</p>' : '') +
              (cited ? '<div class="book__cited"><span>' + esc(I18n.t('library_cited_in')) + '</span>' + cited + '</div>' : '') +
              '</article>';
          });
          html += '</div></section>';
        });
        document.getElementById('lib-groups').innerHTML = html;

        // Books are added after load, so jump to the one named in the address
        if (location.hash.length > 1) {
          var target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
          if (target) setTimeout(function () { target.scrollIntoView({ block: 'center' }); }, 60);
        }
      });
    })();
  </script>
