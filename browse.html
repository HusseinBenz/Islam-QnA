  <script src="assets/js/sakina.js?v=sk4"></script>
  <script src="assets/js/i18n.js?v=sk4"></script>

  <script src="assets/js/site.js?v=sk4"></script>
  <script>
    (function () {
      var esc = Site.escapeHtml;
      var appData = null, currentEntries = [], filteredEntries = [];
      var currentPage = 1, currentPerPage = 10, currentQuery = '', isBrowsing = false;
      var EMPTY_ICON = '<svg width="34" height="34" viewBox="-12 -12 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" d="M11 0L7.78 3.22L7.78 7.78L3.22 7.78L0 11L-3.22 7.78L-7.78 7.78L-7.78 3.22L-11 0L-7.78 -3.22L-7.78 -7.78L-3.22 -7.78L0 -11L3.22 -7.78L7.78 -7.78L7.78 -3.22Z"/></svg>';

      function mark(text) {
        var safe = esc(text);
        if (!currentQuery) return safe;
        currentQuery.split(/\s+/).filter(function (w) { return w.length > 1; }).forEach(function (w) {
          var re = new RegExp('(' + esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
          safe = safe.replace(re, '<mark>$1</mark>');
        });
        return safe;
      }

      function syncUrl() {
        var p = new URLSearchParams();
        p.set('lang', I18n.getLang());
        if (currentQuery) p.set('q', currentQuery); else if (isBrowsing) p.set('browse', '1');
        if (currentPage > 1) p.set('page', currentPage);
        try { history.replaceState(null, '', 'browse.html?' + p.toString()); } catch (e) { /* file:// */ }
      }

      function renderEntries(paginated) {
        var list = document.getElementById('entry-list');
        var status = document.getElementById('results-status');
        var pager = document.getElementById('pagination');
        if (!isBrowsing && currentQuery === '') {
          list.innerHTML = ''; pager.innerHTML = '';
          status.textContent = I18n.t('use_search_or_browse');
          return;
        }
        if (paginated.items.length === 0) {
          list.innerHTML = '<div class="empty-state">' + EMPTY_ICON + '<div>' + esc(I18n.t('no_results')) + '</div></div>';
          status.textContent = ''; pager.innerHTML = '';
          return;
        }
        status.textContent = currentQuery ? I18n.t('results_for') + ' “' + currentQuery + '” (' + paginated.total + ')' : I18n.t('browse') + ' (' + paginated.total + ')';
        var html = '';
        paginated.items.forEach(function (entry, idx) {
          html += '<a class="qrow sk-card sk-lift" style="animation-delay:' + (idx * 0.04) + 's" href="article.html?id=' + entry.id + '&lang=' + I18n.getLang() + '">' +
            '<span class="qrow__body"><span class="qrow__q">' + mark(entry.question) + '</span>' +
            '<span class="qrow__excerpt">' + mark(Site.excerpt(entry.answer, 150)) + '</span>' +
            (entry.tags && entry.tags.length ? '<span class="qrow__tags">' + Site.tagsHtml(entry.tags) + '</span>' : '') +
            '</span>' + Site.ARROW + '</a>';
        });
        list.innerHTML = html;
        renderPagination(paginated);
      }

      function renderPagination(p) {
        var pager = document.getElementById('pagination');
        if (p.totalPages <= 1) { pager.innerHTML = ''; return; }
        var h = '<div class="pagination__nav">';
        h += '<button type="button" class="sk-btn sk-btn--line sk-btn--sm" data-page="' + (p.page - 1) + '"' + (p.page > 1 ? '' : ' disabled') + '>' + esc(I18n.t('previous')) + '</button>';
        h += '<span class="pagination__info">' + esc(I18n.tf('page_of', p.page, p.totalPages)) + '</span>';
        h += '<button type="button" class="sk-btn sk-btn--line sk-btn--sm" data-page="' + (p.page + 1) + '"' + (p.page < p.totalPages ? '' : ' disabled') + '>' + esc(I18n.t('next')) + '</button>';
        h += '</div><label class="per-page-select">' + esc(I18n.t('results_per_page')) + '<select id="per-page-select">';
        appData.config.perPageOptions.forEach(function (o) { h += '<option value="' + o + '"' + (o === currentPerPage ? ' selected' : '') + '>' + o + '</option>'; });
        h += '</select></label>';
        pager.innerHTML = h;
        pager.querySelectorAll('button[data-page]').forEach(function (b) {
          b.addEventListener('click', function () { currentPage = parseInt(this.getAttribute('data-page'), 10); doRender(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
        });
        document.getElementById('per-page-select').addEventListener('change', function () { currentPerPage = parseInt(this.value, 10); currentPage = 1; doRender(); });
      }

      function doSearch() {
        currentQuery = (document.getElementById('search-input').value || '').trim();
        currentPage = 1;
        if (currentQuery) isBrowsing = true;
        doRender();
      }
      function doBrowse() {
        currentQuery = '';
        document.getElementById('search-input').value = '';
        isBrowsing = true; currentPage = 1;
        doRender();
      }
      function doRender() {
        if (!isBrowsing && currentQuery === '') { renderEntries({ items: [], page: 1, perPage: currentPerPage, total: 0, totalPages: 0 }); syncUrl(); return; }
        filteredEntries = currentQuery ? DataStore.searchEntries(currentEntries, currentQuery) : currentEntries.slice();
        renderEntries(DataStore.paginate(filteredEntries, currentPage, currentPerPage));
        syncUrl();
      }

      DataStore.loadAll().then(function (data) {
        appData = data;
        var lang = I18n.init(data.uiStrings, data.languages, data.config.defaultLang);
        currentPerPage = data.config.defaultPerPage;
        Site.initChrome(lang);

        document.getElementById('search-title').textContent = I18n.t('title');
        document.getElementById('search-tagline').textContent = I18n.t('tagline');
        document.getElementById('search-input').placeholder = I18n.t('placeholder');
        document.getElementById('search-label').textContent = I18n.t('search');
        document.getElementById('btn-search').textContent = I18n.t('search');
        document.getElementById('btn-browse').textContent = I18n.t('browse');
        document.title = I18n.t('browse') + ' — ' + I18n.t('title');

        currentEntries = DataStore.getEntries(data.entries, lang, data.config.defaultLang);
        var params = new URLSearchParams(window.location.search);
        if (params.get('q')) { currentQuery = params.get('q'); document.getElementById('search-input').value = currentQuery; isBrowsing = true; }
        else if (params.has('browse')) { isBrowsing = true; }
        if (params.get('page')) currentPage = parseInt(params.get('page'), 10) || 1;
        if (params.get('per_page')) currentPerPage = parseInt(params.get('per_page'), 10) || data.config.defaultPerPage;
        doRender();

        var input = document.getElementById('search-input');
        document.getElementById('btn-search').addEventListener('click', doSearch);
        document.getElementById('btn-browse').addEventListener('click', doBrowse);
        input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } });
        var t;
        input.addEventListener('input', function () {
          clearTimeout(t);
          var v = this.value.trim();
          t = setTimeout(function () {
            if (v.length >= 2) { currentQuery = v; isBrowsing = true; currentPage = 1; doRender(); }
            else if (v.length === 0 && isBrowsing) { currentQuery = ''; doRender(); }
          }, 250);
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === '/' && document.activeElement !== input && !/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '')) { e.preventDefault(); input.focus(); }
        });
      });
    })();
  </script>
