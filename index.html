  <script src="assets/js/sakina.js?v=sk4"></script>

  <script src="assets/js/site.js?v=qa5"></script>
  <script>
    (function () {
      var esc = Site.escapeHtml;
      function set(id, text) { document.getElementById(id).textContent = text; }

      DataStore.loadAll().then(function (data) {
        var lang = I18n.init(data.uiStrings, data.languages, data.config.defaultLang);
        Site.initChrome(lang);
        document.title = I18n.t('title');

        // Hero: the tagline is split at its dash into a headline and a lede
        var parts = I18n.t('tagline').split(/\s+—\s+/);
        set('home-hero-eyebrow', I18n.t('title'));
        set('home-hero-title', parts[0]);
        var lede = document.getElementById('home-hero-tagline');
        if (parts[1]) lede.textContent = parts[1].charAt(0).toUpperCase() + parts[1].slice(1); else lede.hidden = true;

        var input = document.getElementById('home-search-input');
        input.placeholder = I18n.t('placeholder');
        set('home-search-label', I18n.t('search'));
        set('home-btn-search', I18n.t('search'));
        function goSearch(q) { window.location.href = 'browse.html?lang=' + lang + (q ? '&q=' + encodeURIComponent(q) : ''); }
        document.getElementById('home-btn-search').addEventListener('click', function () { goSearch(input.value.trim()); });

        var entries = DataStore.getEntries(data.entries, lang, data.config.defaultLang);
        var byId = {};
        entries.forEach(function (e) { byId[e.id] = e; });
        Site.suggest(input, document.getElementById('home-suggest'), entries, lang, goSearch);

        // Three questions to try, different on every visit
        var shuffled = entries.slice().sort(function () { return Math.random() - 0.5; });
        var tries = document.getElementById('home-random-cards');
        tries.innerHTML = '<span class="try__label">' + esc(I18n.t('try_label')) + '</span>';
        shuffled.slice(0, 3).forEach(function (e) {
          var a = document.createElement('a');
          a.className = 'sk-chip';
          a.href = Site.articleUrl(e.id, lang);
          a.textContent = e.question;
          tries.appendChild(a);
        });

        // What the site holds, counted from the data
        var counts = DataStore.tagCounts(entries);
        var topics = (data.config.topics || []).filter(function (t) { return counts[t]; });
        var bookCount = Object.keys(data.sources || {}).length;
        document.getElementById('home-stats').innerHTML =
          '<li><strong>' + entries.length + '</strong>' + esc(I18n.t('stat_questions')) + '</li>' +
          '<li><strong>' + bookCount + '</strong>' + esc(I18n.t('stat_books')) + '</li>' +
          '<li><strong>' + topics.length + '</strong>' + esc(I18n.t('stat_topics')) + '</li>';

        // Topics
        set('topics-eyebrow', I18n.t('topics_eyebrow'));
        set('topics-title', I18n.t('topics_title'));
        set('topics-subtitle', I18n.t('topics_subtitle'));
        document.getElementById('topics-grid').innerHTML = topics.map(function (t, i) {
          return '<a class="topic sk-card sk-lift sk-reveal" style="transition-delay:' + (i % 4) * 0.05 + 's" href="' + Site.tagUrl(t, lang) + '">' +
            '<span class="sk-tile sk-tile--md">' + Site.topicIcon(t, 22) + '</span>' +
            '<span class="topic__text"><span class="topic__name">' + esc(Site.tagLabel(t)) + '</span>' +
            '<span class="topic__count">' + counts[t] + '</span></span></a>';
        }).join('');

        // Verse
        set('hero-verse-arabic', I18n.t('hero_quran_verse'));
        set('hero-verse-translation', I18n.t('hero_quran_translation'));
        set('hero-verse-ref', I18n.t('hero_quran_ref').replace(/^—\s*/, ''));

        // Letter & purpose
        ['speech_title', 'speech_p1', 'speech_p2', 'speech_p3', 'speech_p4', 'speech_quote', 'speech_p5',
         'purpose_title', 'purpose_p1', 'purpose_p2', 'purpose_p3',
         'speech_eyebrow', 'purpose_eyebrow', 'explore_eyebrow', 'explore_title', 'explore_subtitle',
         'voices_eyebrow', 'voices_title', 'voices_subtitle', 'principles_eyebrow',
         'shelf_eyebrow', 'shelf_title', 'closing_title', 'closing_text'].forEach(function (key) {
          set(key.replace('_', '-'), I18n.t(key));
        });
        set('speech-quote-ref', I18n.t('speech_quote_ref').replace(/^—\s*/, ''));

        // Start here: the featured questions
        set('explore-cta-text', I18n.t('welcome_cta'));
        document.getElementById('explore-cta').href = 'browse.html?lang=' + lang;
        var featured = (data.config.featured || []).map(function (id) { return byId[id]; }).filter(Boolean);
        if (featured.length < 3) featured = entries.slice(0, 6);
        document.getElementById('popular-grid').innerHTML = featured.map(function (e) { return Site.cardHtml(e, lang, 'sk-reveal'); }).join('');

        // Voices: quotations traced to their books
        document.getElementById('voices-grid').innerHTML = (data.voices || []).map(function (v) {
          var src = data.sources[v.source];
          if (!src) return '';
          var s = Site.sourceText(src, lang);
          var quote = (v.quote && (v.quote[lang] || v.quote.en)) || '';
          var who = (v.who && (v.who[lang] || v.who.en)) || '';
          var translated = I18n.t('voices_translated');
          var more = byId[v.article]
            ? '<a class="voice__more" href="' + Site.articleUrl(v.article, lang) + '">' + esc(I18n.t('voices_read')) + Site.ARROW + '</a>' : '';
          return '<figure class="voice sk-card sk-reveal' + (quote.length > 150 ? ' voice--long' : '') + '">' +
            '<blockquote class="voice__quote">' + esc(quote) + '</blockquote>' +
            '<figcaption class="voice__by"><strong>' + esc(s.author) + '</strong><span>' + esc(who) + '</span>' +
            '<span><em>' + esc(s.title) + '</em>' + (s.year ? (lang === 'ar' ? '، ' : ', ') + esc(s.year) : '') +
            (translated && translated !== 'voices_translated' ? ' · ' + esc(translated) : '') + '</span>' + more + '</figcaption></figure>';
        }).join('');

        // How we answer
        var P_ICONS = [
          '<path d="M12 7.5v12.5"/><path d="M3 5.5h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5v12.5h-6a3 3 0 0 0-3 2 3 3 0 0 0-3-2H3z"/>',
          '<path d="M12 3.5v17"/><path d="M8 20.5h8"/><path d="M5 7h14"/><path d="M5 7l-2.6 6.5a2.8 2.8 0 0 0 5.2 0z"/><path d="M19 7l-2.6 6.5a2.8 2.8 0 0 0 5.2 0z"/>',
          '<circle cx="12" cy="12" r="3.6"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>'
        ];
        document.getElementById('principles-grid').innerHTML = [1, 2, 3].map(function (n) {
          return '<div class="principle sk-card sk-reveal" style="transition-delay:' + (n - 1) * 0.06 + 's">' +
            '<span class="sk-tile sk-tile--md"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + P_ICONS[n - 1] + '</svg></span>' +
            '<h3>' + esc(I18n.t('principle_' + n + '_title')) + '</h3><p>' + esc(I18n.t('principle_' + n + '_text')) + '</p></div>';
        }).join('');

        // Bookshelf
        set('shelf-text', I18n.tf('shelf_text', bookCount));
        set('shelf-cta-text', I18n.t('shelf_cta'));
        document.getElementById('shelf-cta').href = 'library.html?lang=' + lang;
        document.getElementById('shelf-spines').innerHTML = (data.config.shelf || []).map(function (key) {
          var src = data.sources[key];
          if (!src) return '';
          var s = Site.sourceText(src, lang);
          var label = Site.spineLabel(src, lang);
          return '<a class="spine" href="library.html?lang=' + lang + '#' + key + '" title="' + esc(s.author + ' — ' + s.title) + '">' + esc(label) + '</a>';
        }).join('');

        // Closing
        var browse = document.getElementById('closing-browse');
        browse.textContent = I18n.t('welcome_cta');
        browse.href = 'browse.html?lang=' + lang;
        var random = document.getElementById('closing-random');
        random.textContent = I18n.t('surprise');
        if (shuffled.length > 3) random.href = Site.articleUrl(shuffled[3].id, lang); else random.hidden = true;

        Sakina.reveal(document);
      });
    })();
  </script>
