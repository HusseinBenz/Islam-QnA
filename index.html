  <main id="main" class="sk-container">

        <svg class="sk-slow-spin" width="30" height="30" viewBox="-12 -12 24 24"><path style="fill:var(--gold-bright)" d="M11 0L7.78 3.22L7.78 7.78L3.22 7.78L0 11L-3.22 7.78L-7.78 7.78L-7.78 3.22L-11 0L-7.78 -3.22L-7.78 -7.78L-3.22 -7.78L0 -11L3.22 -7.78L7.78 -7.78L7.78 -3.22Z"/><circle r="3.2" style="fill:var(--bg)"/></svg>
      </div>
      <span class="sk-eyebrow sk-rise" id="home-hero-eyebrow">Discover Islam</span>
      <h1 class="sk-display home-hero__title sk-rise sk-d1" id="home-hero-title">Clear answers to <em>common doubts</em></h1>
      <p class="sk-lede home-hero__lede sk-rise sk-d2" id="home-hero-tagline"></p>
      <div class="search sk-rise sk-d3">
        <div class="sk-field">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <label class="sk-visually-hidden" for="home-search-input" id="home-search-label">Search</label>

          <span class="sk-kbd" aria-hidden="true">/</span>
          <button type="button" class="sk-btn sk-btn--primary" id="home-btn-search">Search</button>
        </div>
        <div class="suggest" id="home-suggest" hidden></div>
      </div>
      <div class="try sk-rise sk-d4" id="home-random-cards"></div>
    </section>

    <!-- Verse -->
    <section class="verse-panel sk-reveal" aria-label="Verse">

        <p class="verse__ref" id="hero-verse-ref"></p>
      </div>

    <!-- A letter to the reader -->
    <section class="letter">
      <div class="letter__head sk-reveal">
        <span class="sk-eyebrow" id="speech-eyebrow">A word first</span>
        <h2 class="sk-display" id="speech-title"></h2>
      </div>
      <div class="letter__body">
        <p class="sk-reveal" id="speech-p1"></p>
        <p class="sk-reveal" id="speech-p2"></p>
        <p class="sk-reveal" id="speech-p3"></p>
        <p class="sk-reveal" id="speech-p4"></p>
        <blockquote class="letter__quote sk-reveal">
          <svg width="26" height="26" viewBox="-12 -12 24 24" aria-hidden="true"><path style="fill:var(--gold-bright);stroke:var(--bg)" stroke-width="2" d="M11 0L7.78 3.22L7.78 7.78L3.22 7.78L0 11L-3.22 7.78L-7.78 7.78L-7.78 3.22L-11 0L-7.78 -3.22L-7.78 -7.78L-3.22 -7.78L0 -11L3.22 -7.78L7.78 -7.78L7.78 -3.22Z"/></svg>
          <span class="letter__quote-text" id="speech-quote"></span>
          <span class="letter__quote-ref" id="speech-quote-ref"></span>
        </blockquote>
        <p class="sk-reveal" id="speech-p5"></p>
      </div>
    </section>

    <section class="letter">
      <div class="letter__head sk-reveal">
        <span class="sk-eyebrow" id="purpose-eyebrow">Our purpose</span>
        <h2 class="sk-display" id="purpose-title"></h2>
      </div>
      <div class="letter__body">
        <p class="sk-reveal" id="purpose-p1"></p>
        <p class="sk-reveal" id="purpose-p2"></p>
        <p class="sk-reveal" id="purpose-p3"></p>
      </div>
    </section>

    <!-- Explore -->
    <section class="explore">
      <div class="explore__head sk-reveal">
        <div>
          <span class="sk-eyebrow" id="explore-eyebrow">Start here</span>
          <h2 class="sk-display" id="explore-title"></h2>
          <p id="explore-subtitle"></p>

  <script src="assets/js/sakina.js?v=sk2"></script>

  <script src="assets/js/site.js?v=sk2"></script>
  <script>
    (function () {
      var esc = Site.escapeHtml;

      DataStore.loadAll().then(function (data) {
        var lang = I18n.init(data.uiStrings, data.languages, data.config.defaultLang);
        Site.initChrome(lang);
        document.title = I18n.t('title');

        // Hero: the tagline is split at its dash into a headline and a lede
        var tagline = I18n.t('tagline');
        var parts = tagline.split(/\s+—\s+/);
        document.getElementById('home-hero-eyebrow').textContent = I18n.t('title');
        document.getElementById('home-hero-title').textContent = parts[0];
        var lede = document.getElementById('home-hero-tagline');
        if (parts[1]) lede.textContent = parts[1].charAt(0).toUpperCase() + parts[1].slice(1); else lede.hidden = true;

        var input = document.getElementById('home-search-input');
        input.placeholder = I18n.t('placeholder');
        document.getElementById('home-search-label').textContent = I18n.t('search');
        document.getElementById('home-btn-search').textContent = I18n.t('search');
        function goSearch(q) { window.location.href = 'browse.html?lang=' + lang + (q ? '&q=' + encodeURIComponent(q) : '&browse=1'); }
        document.getElementById('home-btn-search').addEventListener('click', function () { goSearch(input.value.trim()); });

        var entries = DataStore.getEntries(data.entries, lang, data.config.defaultLang);
        Site.suggest(input, document.getElementById('home-suggest'), entries, lang, goSearch);

        // Three questions to try, different on every visit
        var tries = document.getElementById('home-random-cards');
        tries.innerHTML = '<span class="try__label">' + esc(lang === 'ar' ? 'جرّب' : 'Try') + '</span>';
        entries.slice().sort(function () { return Math.random() - 0.5; }).slice(0, 3).forEach(function (e) {
          var a = document.createElement('a');
          a.className = 'sk-chip';
          a.href = 'article.html?id=' + e.id + '&lang=' + lang;
          a.textContent = e.question;
          tries.appendChild(a);
        });

        // Verse
        document.getElementById('hero-verse-arabic').textContent = I18n.t('hero_quran_verse');
        document.getElementById('hero-verse-translation').textContent = I18n.t('hero_quran_translation');
        document.getElementById('hero-verse-ref').textContent = I18n.t('hero_quran_ref').replace(/^—\s*/, '');

        // Letter & purpose
        ['speech_title', 'speech_p1', 'speech_p2', 'speech_p3', 'speech_p4', 'speech_quote', 'speech_p5',
         'purpose_title', 'purpose_p1', 'purpose_p2', 'purpose_p3'].forEach(function (key) {
          document.getElementById(key.replace('_', '-')).textContent = I18n.t(key);
        });
        document.getElementById('speech-quote-ref').textContent = I18n.t('speech_quote_ref').replace(/^—\s*/, '');
        document.getElementById('speech-eyebrow').textContent = lang === 'ar' ? 'كلمة أولًا' : 'A word first';
        document.getElementById('purpose-eyebrow').textContent = lang === 'ar' ? 'غايتنا' : 'Our purpose';
        document.getElementById('explore-eyebrow').textContent = lang === 'ar' ? 'ابدأ من هنا' : 'Start here';

        // Explore
        document.getElementById('explore-title').textContent = I18n.t('explore_title');
        document.getElementById('explore-subtitle').textContent = I18n.t('explore_subtitle');
        document.getElementById('explore-cta-text').textContent = I18n.t('welcome_cta');
        document.getElementById('explore-cta').href = 'browse.html?lang=' + lang + '&browse=1';

        var grid = document.getElementById('popular-grid');
        var readLabel = lang === 'ar' ? 'دقيقة قراءة' : 'min read';
        [1, 3, 4, 7, 6, 9].forEach(function (id, i) {
          var e = entries.filter(function (x) { return x.id === id; })[0];
          if (!e) return;
          var card = document.createElement('a');
          card.className = 'qcard sk-card sk-lift sk-reveal';
          card.style.transitionDelay = (i % 3) * 0.06 + 's';
          card.href = 'article.html?id=' + e.id + '&lang=' + lang;
          card.innerHTML =
            '<div class="qcard__tags">' + Site.tagsHtml(e.tags.slice(0, 2)).replace(/sk-tag"/, 'sk-tag sk-tag--accent"') + '</div>' +
            '<h3 class="qcard__q">' + esc(e.question) + '</h3>' +
            '<p class="qcard__excerpt">' + esc(Site.excerpt(e.answer, 140)) + '</p>' +
            '<div class="qcard__foot"><span>' + Site.minutes(e.answer) + ' ' + readLabel + '</span>' + Site.ARROW + '</div>';
          grid.appendChild(card);
        });
        Sakina.reveal(document);
      });
    })();
  </script>
